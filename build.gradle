plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
group = 'dev.ironsnouveau'
version = '0.16.2'
base { archivesName = 'irons-nouveau' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral() }
sourceSets { gameTest { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = '21.1.250'
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('withoutGlyphAddons').getOrElse('false').toBoolean()
                    ? 'run/gametest-no-addon' : providers.gradleProperty('standalone').getOrElse('false').toBoolean()
                    ? 'run/gametest-standalone' : 'run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse('irons_nouveau')
        }
    }
    mods { irons_nouveau { sourceSet sourceSets.main; sourceSet sourceSets.gameTest } }
}
dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    runtimeOnly fileTree(dir: 'libs', include: '*.jar',
            excludes: providers.gradleProperty('standalone').getOrElse('false').toBoolean()
                    ? ['ars-spells.jar', 'not-enough-glyphs.jar', 'jei.jar']
                    : providers.gradleProperty('withoutGlyphAddons').getOrElse('false').toBoolean() ? ['not-enough-glyphs.jar'] : [])
    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}

tasks.named('jar') { from('LICENSE'); archiveFileName = "irons-nouveau-${project.version}-mc1.21.1-neoforge.jar" }
tasks.named('sourcesJar') { from('LICENSE') }
